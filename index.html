<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Web Client</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 220px;
  border-right: 1px solid #ddd;
  overflow-y: auto;
}

#chat {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

#input {
  display: flex;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

button {
  padding: 10px;
  border: none;
  cursor: pointer;
}

.user {
  padding: 10px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.user:hover {
  background: #f2f2f2;
}
</style>
</head>

<body>

<div id="sidebar"></div>

<div id="chat">
  <div id="messages"></div>

  <div id="input">
    <input id="msg" placeholder="Type message...">

    <input type="file" id="file">

    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>

let token = prompt("Enter BOT TOKEN:");
let offset = 0;

let chats = {};           // chat list
let history = {};         // chat_id -> messages[]
let currentChat = null;

// ───── POLLING ─────
async function poll() {
  try {
    const res = await fetch(
      `https://api.telegram.org/bot${token}/getUpdates?offset=${offset}&timeout=10`
    );

    const data = await res.json();

    if (data.ok) {
      for (let update of data.result) {
        offset = update.update_id + 1;

        let msg = update.message;
        if (!msg) continue;

        let chat_id = msg.chat.id;

        let name =
          msg.chat.username
            ? "@" + msg.chat.username
            : (msg.chat.first_name || "Unknown");

        if (!history[chat_id]) history[chat_id] = [];

        if (!chats[chat_id]) {
          chats[chat_id] = name;
          addUser(chat_id, name);
        }

        // ───── TEXT ─────
        if (msg.text) {
          saveMessage(chat_id, name, msg.text, "text");
        }

        // ───── PHOTO ─────
        if (msg.photo) {
          let fileId = msg.photo[msg.photo.length - 1].file_id;
          saveMessage(chat_id, name, fileId, "photo");
        }

        // ───── AUDIO ─────
        if (msg.audio) {
          saveMessage(chat_id, name, msg.audio.file_id, "audio");
        }

        // ───── VIDEO ─────
        if (msg.video) {
          saveMessage(chat_id, name, msg.video.file_id, "video");
        }
      }
    }

  } catch (e) {
    console.log(e);
  }

  setTimeout(poll, 1000);
}

// ───── USERS ─────
function addUser(id, name) {
  let div = document.createElement("div");
  div.className = "user";
  div.innerText = name;

  div.onclick = () => {
    currentChat = id;
    renderChat();
  };

  document.getElementById("sidebar").appendChild(div);
}

// ───── SAVE MESSAGE ─────
function saveMessage(chat_id, name, data, type) {
  history[chat_id].push({ name, data, type });

  if (chat_id === currentChat) {
    renderChat();
  }
}

// ───── RENDER CHAT ─────
async function renderChat() {
  let box = document.getElementById("messages");
  box.innerHTML = "";

  if (!history[currentChat]) return;

  for (let m of history[currentChat]) {

    if (m.type === "text") {
      box.innerHTML += `<div><b>${m.name}:</b> ${m.data}</div>`;
    }

    else if (m.type === "photo") {
      let url = await getFileUrl(m.data);
      box.innerHTML += `
        <div><b>${m.name}:</b><br>
        <img src="${url}" style="max-width:250px;border-radius:10px">
        </div>`;
    }

    else if (m.type === "audio") {
      let url = await getFileUrl(m.data);
      box.innerHTML += `
        <div><b>${m.name}:</b><br>
        <audio controls src="${url}"></audio>
        </div>`;
    }

    else if (m.type === "video") {
      let url = await getFileUrl(m.data);
      box.innerHTML += `
        <div><b>${m.name}:</b><br>
        <video controls width="250" src="${url}"></video>
        </div>`;
    }
  }

  box.scrollTop = box.scrollHeight;
}

// ───── GET FILE URL ─────
async function getFileUrl(file_id) {
  let r = await fetch(
    `https://api.telegram.org/bot${token}/getFile?file_id=${file_id}`
  );

  let data = await r.json();

  return `https://api.telegram.org/file/bot${token}/${data.result.file_path}`;
}

// ───── SEND MESSAGE ─────
async function sendMessage() {
  if (!currentChat) return alert("Select chat first!");

  let text = document.getElementById("msg").value;
  let file = document.getElementById("file").files[0];

  if (file) {
    let form = new FormData();
    form.append("chat_id", currentChat);

    if (file.type.startsWith("image/")) {
      form.append("photo", file);

      await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
        method: "POST",
        body: form
      });

    } else if (file.type.startsWith("audio/")) {
      form.append("audio", file);

      await fetch(`https://api.telegram.org/bot${token}/sendAudio`, {
        method: "POST",
        body: form
      });

    } else if (file.type.startsWith("video/")) {
      form.append("video", file);

      await fetch(`https://api.telegram.org/bot${token}/sendVideo`, {
        method: "POST",
        body: form
      });

    } else {
      form.append("document", file);

      await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {
        method: "POST",
        body: form
      });
    }

    document.getElementById("file").value = "";
    return;
  }

  if (!text.trim()) return;

  let body = new URLSearchParams();
  body.append("chat_id", currentChat);
  body.append("text", text);

  await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: body.toString()
  });

  document.getElementById("msg").value = "";
}

poll();

</script>
</body>
</html>
