<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telegram Web Client</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 220px;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    #input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border: none;
      cursor: pointer;
    }

    .user {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .user:hover {
      background: #f2f2f2;
    }
  </style>
</head>

<body>

<div id="sidebar"></div>

<div id="chat">
  <div id="messages"></div>

  <div id="input">
    <input id="msg" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let token = prompt("Enter BOT TOKEN:");
let offset = 0;

let chats = {};        // chat_id -> name
let currentChat = null;

// ───── POLLING LOOP ─────
async function poll() {
  try {
    const res = await fetch(
      `https://api.telegram.org/bot${token}/getUpdates?offset=${offset}&timeout=10`
    );

    const data = await res.json();

    if (data.ok) {
      for (let update of data.result) {
        offset = update.update_id + 1;

        let msg = update.message;
        if (!msg) continue;

        let chat = msg.chat;
        let chat_id = chat.id;
        let text = msg.text || "";

        let name = chat.username
          ? "@" + chat.username
          : (chat.first_name || "Unknown");

        // ───── ACTIVATE USER ─────
        if (text === "/start") {
          if (!chats[chat_id]) {
            chats[chat_id] = name;
            addUser(chat_id, name);
          }

          await sendApi(chat_id, "Bot activated ✔");
          continue;
        }

        // ───── SHOW MESSAGE ─────
        if (chats[chat_id]) {
          showMessage(name, text);
        }
      }
    }

  } catch (e) {
    console.log("Error:", e);
  }

  setTimeout(poll, 1000);
}

// ───── ADD USER TO SIDEBAR ─────
function addUser(id, name) {
  let div = document.createElement("div");
  div.className = "user";
  div.innerText = name;

  div.onclick = () => {
    currentChat = id;
    document.getElementById("messages").innerHTML = "";
  };

  document.getElementById("sidebar").appendChild(div);
}

// ───── SHOW MESSAGE ─────
function showMessage(name, text) {
  let box = document.getElementById("messages");
  box.innerHTML += `<div><b>${name}:</b> ${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

// ───── SEND MESSAGE ─────
async function sendMessage() {
  if (!currentChat) {
    alert("Select a chat first!");
    return;
  }

  let input = document.getElementById("msg");
  let text = input.value.trim();

  if (!text) return;

  await sendApi(currentChat, text);

  showMessage("You", text);
  input.value = "";
}

// ───── TELEGRAM API WRAPPER (IMPORTANT FIX) ─────
async function sendApi(chat_id, text) {
  const body = new URLSearchParams();
  body.append("chat_id", chat_id);
  body.append("text", text);

  await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: body.toString()
  });
}

// start loop
poll();
</script>

</body>
</html>
